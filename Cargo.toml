[package]
name = "lwsc2"
version = "0.1.0"
edition = "2021"
default-run = "bot"
description = "High-performance Last War: Survival Game Automation Bot and State Detection Engine in Rust"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
x11rb = { version = "0.13", features = ["all-extensions"] }
colored = "2.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rayon = "1.10"
eframe = "0.27"
winit = "0.29.15"

[lib]
name = "lwsc2"
path = "src/lib.rs"

[[bin]]
name = "lwsc2"
path = "src/main.rs"

[[bin]]
name = "bot"
path = "src/bin/bot.rs"

[[bin]]
name = "calc_roi"
path = "src/bin/calc_roi.rs"

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 3
