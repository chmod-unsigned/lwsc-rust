buttons:
- id: MAIN_SHOP
  display_name: Main Shop Button
  parent_states:
  - BASE
  - AREA
  target_state: MAIN_SHOP
  template: roi/MAIN_SHOP/expected.png
  roi:
    xmin: 0.87
    xmax: 1.0
    ymin: 0.0
    ymax: 0.09
  min_confidence: 0.85
  description: Main Shop entrance button on Base and Area screens.

- id: ALLIANCE
  display_name: Alliance Button
  parent_states:
  - BASE
  - AREA
  target_state: ALLIANCE
  template: roi/ALLIANCE/expected.png
  roi:
    xmin: 0.9
    xmax: 1.0
    ymin: 0.63
    ymax: 0.78
