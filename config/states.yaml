actions:
- name: alliance_help
  description: Auto-click Alliance Help button when visible in bottom-right area
  button: HELP
  enabled: true
  cooldown_s: 2.0
  priority: 1

- name: alliance_gift_claim
  description: Auto-claim all available regular alliance gifts
  button: ALLIANCE_GIFTS_BUTTON
  enabled: true
  state: ALLIANCE_GIFTS_REGULAR
  cooldown_s: 5.0
  priority: 2

- name: radar_task_claim
  description: Auto-claim radar mission rewards when prompt appears
  button: RADAR_TASKS_BUTTON
  enabled: false
  cooldown_s: 3.0
  priority: 3
